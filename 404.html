<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>POS For You</title><meta name="robots" content="noindex">
<script>
(function () {
  var reserved = { en: 1, ar: 1, menu: 1, app: 1, login: 1, signup: 1 };
  var parts = location.pathname.replace(/^\/+|\/+$/g, "").split("/");
  var slug = (parts[0] || "").toLowerCase();
  var ok = /^[a-z0-9][a-z0-9-]{0,62}$/.test(slug) && !reserved[slug] && (parts.length === 1 || (parts.length === 2 && parts[1] === "menu"));
  location.replace(ok ? "https://app.posforyou.me/" + slug + "/menu" + location.search : "/");
})();
</script></head>
<body style="font-family:system-ui;text-align:center;padding:40px"><a href="/">POS For You</a></body></html>
